<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prak-threejs</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            height: 100vh;
            overflow: hidden;
        }

        #webgl {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #loader-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }

        .label-3d {
            color: white;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .label-title {
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <canvas id="webgl"></canvas>

    <div id="loader-info">Loading 3D Asset</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@latest/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@latest/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
